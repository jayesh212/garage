<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dream Garage</title>
<meta name="description" content="Build your dream garage from 1,800 of the world's finest cars and share it.">
<meta property="og:title" content="A dream garage">
<meta property="og:description" content="Someone built their dream garage on Garage. See what's in it.">
<meta property="og:image" content="https://jayesh212.github.io/garage/assets/og.jpg">
<meta name="twitter:card" content="summary_large_image">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=Unbounded:wght@600;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/styles.css">
</head>
<body>
<div class="wrap">
  <header class="top"><a class="logo" href="../">garage/</a><nav id="nav"></nav></header>
  <section class="hero"><h1 id="title">Dream garage</h1><div class="hero-sub"><p id="sub">Pick the cars you'd keep forever.<br>Kept in this browser; share it with a link.</p></div></section>
  <div id="banner"></div>
  <div class="stats" id="stats"></div>
  <div class="row" id="actions" style="padding:8px 0 4px"></div>
  <div id="cars"></div>
  <p class="eyebrow">ADD CARS</p>
  <label class="search" style="margin-top:8px"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>
    <input type="search" id="q" placeholder="Search make, model, year" aria-label="Search cars to add"></label>
  <div class="grid" id="results" style="margin-top:12px"></div>
  <footer><span>Values are estimates of typical market value, not appraisals.</span><a href="../">Browse the full catalog</a></footer>
</div>
<dialog id="detail" aria-label="Car details"></dialog>
<script type="module">
import { loadCatalog, fmt, money, valueAt, growth, esc, cardHTML, openDetail, openFromHash, navHTML, matches, dream } from "../assets/catalog.js";
const cat = await loadCatalog();
const now = new Date().getFullYear();
const dialog = document.getElementById("detail");
const params = new URLSearchParams(location.search);
// A shared link shows someone else's dream garage until the visitor adopts it.
const shared = params.get("ids")?.split(",").map(Number).filter((id) => cat.byId.has(id)) ?? null;
const ids = () => (shared ?? dream.ids()).filter((id) => cat.byId.has(id));

function paint() {
  document.getElementById("nav").innerHTML = navHTML(shared ? "" : "dream");
  const cars = ids().map((id) => cat.byId.get(id));
  const value = cars.reduce((s, c) => s + (valueAt(c, now) || 0), 0);
  const then = cars.reduce((s, c) => s + (valueAt(c, now - 5) || 0), 0);
  const hp = cars.reduce((s, c) => s + (c.hp || 0), 0);
  const limited = cars.filter((c) => c.production != null);
  const rarest = limited.slice().sort((a, b) => a.production - b.production)[0];
  document.getElementById("banner").innerHTML = shared ? `<div class="vs-form" style="margin:0 0 14px">
      <p style="margin:0 0 10px">Someone shared their dream garage with you.</p>
      <div class="row"><button class="pill btn-accent" id="adopt">Make it my dream garage</button><a class="pill" href="./">See mine</a></div></div>` : "";
  document.getElementById("stats").innerHTML = cars.length ? `
    <div class="stat accent"><b>${money(value)}</b><span>estimated value of ${cars.length} car${cars.length === 1 ? "" : "s"}</span></div>
    <div class="stat"><b>${then > 0 ? `${value >= then ? "+" : ""}${Math.round(((value - then) / then) * 100)}%` : "—"}</b><span>over five years</span></div>
    <div class="stat"><b>${fmt(hp)}</b><span>hp combined</span></div>
    <div class="stat"><b>${rarest ? fmt(rarest.production) : "—"}</b><span>${rarest ? `rarest: ${esc(rarest.brand.name)} ${esc(rarest.model)}` : "no limited editions yet"}</span></div>` : "";
  const link = `${location.origin}${location.pathname}?ids=${ids().join(",")}`;
  document.getElementById("actions").innerHTML = cars.length && !shared ? `<button class="pill btn-dark" id="share">Copy share link</button><button class="pill" id="clear">Start over</button>` : "";
  const list = document.getElementById("cars");
  if (cars.length) {
    list.innerHTML = `<div class="grid">${cars.map((c) => cardHTML(c)).join("")}</div>`;
  } else {
    const holy = cat.sets.find((s) => /trinity/i.test(s.name)) || cat.sets[0];
    list.innerHTML = `<p class="empty" style="padding:24px 0">Nothing here yet. Search below, or start with ${holy ? `<button class="pill btn-accent" id="seed">${esc(holy.name)}</button>` : "an icon"}.</p>`;
    document.getElementById("seed")?.addEventListener("click", () => { dream.replace(holy.ids); document.dispatchEvent(new CustomEvent("dream")); paint(); });
  }
  document.getElementById("share")?.addEventListener("click", async (e) => {
    try { await navigator.clipboard.writeText(link); e.target.textContent = "Link copied"; } catch { prompt("Copy this link", link); }
  });
  document.getElementById("clear")?.addEventListener("click", () => { dream.replace([]); document.dispatchEvent(new CustomEvent("dream")); paint(); });
  document.getElementById("adopt")?.addEventListener("click", () => { dream.replace(shared); location.href = "./"; });
  document.getElementById("title").textContent = shared ? "A dream garage" : "Your dream garage";
  if (shared) document.getElementById("sub").textContent = "Hand-picked by a fellow enthusiast. Make it yours, or start your own.";
}

const q = document.getElementById("q"), results = document.getElementById("results");
function search() {
  const text = q.value.trim();
  const found = text ? cat.cars.filter((c) => matches(c, text, {})).slice(0, 12) : [];
  results.innerHTML = found.map((c) => cardHTML(c)).join("");
}
let t;
q.addEventListener("input", () => { clearTimeout(t); t = setTimeout(search, 100); });
document.body.addEventListener("click", (e) => {
  const card = e.target.closest(".card");
  if (card) openDetail(dialog, cat.byId.get(Number(card.dataset.id)), "", { compare: false });
});
dialog.addEventListener("click", (e) => { if (e.target === dialog) dialog.close(); });
document.addEventListener("dream", () => { if (!shared) paint(); });
paint();
openFromHash(dialog, cat.byId, { compare: false });
</script>
</body>
</html>
